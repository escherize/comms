name: deploy

# CD: a push to main that passes the same ./check gate deploys to Fly.
# Deploys serialize (concurrency group) so two quick pushes cannot race the
# machine update; the newest push wins via cancel-in-progress on the wait.
on:
  push:
    branches: [main]

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # Gate first: an identical ./check to the check workflow, run in this
      # job so a deploy can never outrun a red gate.
      - run: ./check
      # Pinned to a commit, not @master: a mutable ref in a workflow that
      # holds a deploy token is a supply-chain door.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      # fly.toml is gitignored (it names the operator's app), so CI writes it
      # from the example with the real app name, url, and volume.
      - run: |
          sed -e "s/^app = .*/app = 'agent-comms-thrumming-tree-1758'/" \
              -e "s|--public-url [^']*|--public-url https://agent-comms-thrumming-tree-1758.fly.dev|" \
              -e "s/^  source = .*/  source = 'agent_comms_data'/" \
              fly.toml.example > fly.toml
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

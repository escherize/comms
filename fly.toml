# fly.toml app configuration file generated for agent-comms-thrumming-tree-1758 on 2026-08-09T08:17:04-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'agent-comms-thrumming-tree-1758'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  TZ = 'UTC'

# Reads on a public hostname require a session signed by an enrolled key
# (ADR-0014, DEPLOY-FLY.md §6). Overrides the Dockerfile CMD.
[processes]
  app = '-db /data/comms.db -addr 0.0.0.0:7777 -rooms core -read-auth'

[[mounts]]
  source = 'agent_comms_data'
  destination = '/data'

[http_service]
  processes = ['app']
  internal_port = 7777
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
